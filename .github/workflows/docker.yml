name: Build and publish Docker image
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pkgs_r.txt
      - install_r_pkgs.R
      - install_py_reticulate.R
      - rstudio-prefs.json
      - rserver.conf
      - .github/workflows/docker.yml
  workflow_dispatch:
env:
  IMAGE: atpoint/bioc_3_23_omics
concurrency:
  group: docker-publish
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }},ignore-error=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 7
          overwrite: true
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Determine next version
        id: version
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.request

          image = os.environ['IMAGE']
          url = f'https://hub.docker.com/v2/repositories/{image}/tags/?page_size=100'
          versions = []
          while url:
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = json.load(response)
              for tag in data['results']:
                  match = re.fullmatch(r'1\.(\d+)', tag['name'])
                  if match:
                      versions.append(int(match.group(1)))
              url = data.get('next')
          version = f'1.{max(versions, default=-1) + 1}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\n')
          PY
      - name: Publish multi-architecture image
        run: |
          refs=()
          for digest in /tmp/digests/*; do
            refs+=("${IMAGE}@sha256:$(basename "$digest")")
          done
          test "${#refs[@]}" -eq 2
          docker buildx imagetools create \
            -t "${IMAGE}:${{ steps.version.outputs.version }}" \
            -t "${IMAGE}:latest" \
            "${refs[@]}"
      - name: Inspect published image
        run: |
          docker buildx imagetools inspect \
            "${IMAGE}:${{ steps.version.outputs.version }}"
